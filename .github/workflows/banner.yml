name: banner

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Runners have no GPU. Mesa's CPU renderer gives the same pixels every time.
      - run: npx vgpu install-software-renderer

      - run: node src/build.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VGPU_ADAPTER: software

      - name: Commit the banner if it changed
        run: |
          if [ -z "$(git status --porcelain README.md assets)" ]; then
            echo "banner unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets
          git commit -m "chore: re-render profile banner"
          git push
